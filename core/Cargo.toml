[package]
name = "luks_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform userspace LUKS + filesystem engine"

[lib]
name = "luks_core"
# rlib only. The Android `.so` is `luks_jni`, which links this statically and
# exports the `Java_*` symbols; a second cdylib here would be a dead 300 KB in
# the APK. `cargo build -p luks_jni --target aarch64-linux-android` is still the
# build that proves the NDK linker works, since an rlib never invokes a linker.
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }
base64 = "0.22"
argon2 = "0.5"
pbkdf2 = "0.12"
hmac = "0.12"
# `zeroize` is NOT default in `aes` — without it every expanded key schedule
# (240 bytes per Aes256, from which the original key is trivially recoverable,
# since the schedule is invertible) is dropped un-wiped. The XTS paths build
# two cipher instances per call, so an un-wiped build litters the heap with
# master-key residue. With the feature, `cipher`'s internals zeroize on drop.
aes = { version = "0.8", features = ["zeroize"] }
xts-mode = "0.5"
subtle = "2"
crc32c = "0.6"   # Castagnoli, hardware-accelerated. NOT crc32fast — wrong polynomial.
crc32fast = "1"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9.0"
lzo = "0.1.2"

[dev-dependencies]
sha2 = { version = "0.10", features = ["asm"] }
# Host-side examples only — never compiled into the Android library. Echo-off
# terminal input is fiddly and platform-specific (termios on unix, console
# handles on Windows); this is the crate everyone uses for it, and it is
# Apache-2.0.
rpassword = "7"

[lints.rust]
# `aes_armv8` is a custom cfg set in ../.cargo/config.toml — see the long note
# there. Declared so `cfg!(aes_armv8)` does not trip the unexpected_cfgs lint.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aes_armv8)'] }

[[example]]
name = "write_to_drive"
# Without this the example is compiled by a *default* `cargo test`, where
# `FileDevice::open_writable` does not exist, and the default build fails.
# The point of the feature is that a default build has no write code in it —
# an example that assumes otherwise breaks exactly that guarantee.
required-features = ["dangerous-write-support"]

[features]
default = []
# V1 is read-only. Write opcodes are not compiled unless this is explicitly
# enabled, so a bug cannot corrupt a drive: the instruction is not in the binary.
dangerous-write-support = []

# [profile.release] moved to the workspace root Cargo.toml — Cargo ignores
# profile settings in non-root members and warns about them.

[[example]]
name = "write_btrfs_to_drive"
required-features = ["dangerous-write-support"]

[[example]]
name = "space_probe"
required-features = ["dangerous-write-support"]
