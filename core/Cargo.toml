[package]
name = "luks_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform userspace LUKS + filesystem engine"

[lib]
name = "luks_core"
# rlib only. The Android `.so` is `luks_jni`, which links this statically and
# exports the `Java_*` symbols; a second cdylib here would be a dead 300 KB in
# the APK. `cargo build -p luks_jni --target aarch64-linux-android` is still the
# build that proves the NDK linker works, since an rlib never invokes a linker.
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }
base64 = "0.22"
argon2 = "0.5"
pbkdf2 = "0.12"
hmac = "0.12"
aes = "0.8"
xts-mode = "0.5"
subtle = "2"
crc32fast = "1"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
ruzstd = "0.9.0"
lzo = "0.1.2"

[dev-dependencies]
sha2 = "0.10"
# Host-side examples only — never compiled into the Android library. Echo-off
# terminal input is fiddly and platform-specific (termios on unix, console
# handles on Windows); this is the crate everyone uses for it, and it is
# Apache-2.0.
rpassword = "7"

[lints.rust]
# `aes_armv8` is a custom cfg set in ../.cargo/config.toml — see the long note
# there. Declared so `cfg!(aes_armv8)` does not trip the unexpected_cfgs lint.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aes_armv8)'] }

[features]
default = []
# V1 is read-only. Write opcodes are not compiled unless this is explicitly
# enabled, so a bug cannot corrupt a drive: the instruction is not in the binary.
dangerous-write-support = []

# [profile.release] moved to the workspace root Cargo.toml — Cargo ignores
# profile settings in non-root members and warns about them.
