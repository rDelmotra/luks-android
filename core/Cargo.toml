[package]
name = "luks_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform userspace LUKS + filesystem engine"

[lib]
name = "luks_core"
# rlib for `cargo test`; cdylib for the Android `.so` loaded over JNI.
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }
base64 = "0.22"
argon2 = "0.5"
pbkdf2 = "0.12"
hmac = "0.12"
aes = "0.8"
xts-mode = "0.5"
subtle = "2"
crc32fast = "1"

[dev-dependencies]
sha2 = "0.10"

[features]
default = []
# V1 is read-only. Write opcodes are not compiled unless this is explicitly
# enabled, so a bug cannot corrupt a drive: the instruction is not in the binary.
dangerous-write-support = []

[profile.release]
lto = true
codegen-units = 1
# NOT panic = "abort". The JNI layer must wrap every entry point in
# catch_unwind, which requires unwinding. We parse attacker-controlled GPT,
# LUKS and ext4 metadata; with abort, a malformed drive kills the whole app,
# whereas unwinding lets it surface as a Java exception and an error message.
strip = true
