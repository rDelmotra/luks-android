[package]
name = "luks_jni"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JNI bridge exposing luks_core + luks_usbfs to the Android app"

[lib]
name = "luks_jni"
# cdylib only. Nothing links this as a Rust library; the JVM dlopen()s it.
# `rlib` as well so the crate's own integration tests can call into `bridge`.
crate-type = ["cdylib", "rlib"]

[features]
# Off by default, exactly as in `luks_core`. A release build of the app must
# not contain the write path at all — not disabled, absent — which is what
# `tools/verify-no-write-code.sh` checks for the library and the Android build
# checks for the `.so`. Turning this on changes what `SharedDevice` can do, so
# it is not a switch that can be flipped without the write code coming along.
dangerous-write-support = ["luks_core/dangerous-write-support"]

[dependencies]
luks_core = { path = "../core" }
luks_usbfs = { path = "../usbfs" }
jni = "0.21"
serde_json = "1"
# Streaming verification of a file on the drive without materialising it.
sha2 = "0.10"

[lints.rust]
# `aes_armv8` is a custom cfg set in ../.cargo/config.toml — see the long note
# there. Declared here for the same reason `core` declares it: without it this
# crate warns on every build, and a build that always prints a warning is a
# build where a new one goes unnoticed.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aes_armv8)'] }
